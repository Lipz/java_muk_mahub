spring.application.name=monitor

# PostgreSQL Database Connection
# Driver class and dialect are both auto-detected from the URL -- do not set them.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monitor_db}
spring.datasource.username=${DB_USER:lipz}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate/JPA Settings
# init.sql owns the schema; Hibernate must never author it.
# `validate` keeps init.sql and the entity mappings a checked pair --
# a mismatch fails startup instead of corrupting data silently.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Custom property for JWT (Generate a secure 256-bit base64 key in production)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.issuer=mea-vea
cors.allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://localhost:5173}

# LDAP Server
ldap.domain=customs.local
ldap.url=ldap://10.0.9.16:389
ldap.base=OU=NPT,OU=GDCE,DC=customs,DC=local
ldap.bind-dn=CN=ldappro,OU=NPT,OU=GDCE,DC=customs,DC=local
ldap.bind-password=x9QmI6yX
ldap.user-search-base=OU=NPT,OU=GDCE,DC=customs,DC=local
ldap.user-search-filter=(sAMAccountName={0})

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:10.0.6.44}
spring.data.redis.port=${REDIS_PORT:6379}
# spring.data.redis.password=

# Server presence: how long after a scrape a server still counts as online.
# Must comfortably exceed the agent publish interval (3-5s) or normal jitter
# reads as flapping -- roughly 3x.
monitor.presence.ttl-seconds=${PRESENCE_TTL_SECONDS:15}

# Server Logs Storage (defaults to ./logs)
log.storage.base-path=${LOG_STORAGE_PATH:./logs}
# Live log tail (SSE): open tails per user before the oldest is evicted, keep-alive interval,
# and lines of today's file sent when a tail opens
log.stream.max-per-user=${LOG_STREAM_MAX_PER_USER:3}
log.stream.heartbeat-seconds=15
log.stream.backfill-lines=200
# Longest a streamed response may take, start to finish: bounds the today-file download
# (a 100 MB file needs >= ~2.3 MB/s to fit in 45s). The live tail is not affected: its
# SseEmitter sets its own timeout (none) per request.
spring.mvc.async.request-timeout=${DOWNLOAD_TIMEOUT:45s}
